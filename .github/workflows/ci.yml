name: Python, browser and Docker checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: All JavaScript and browser-independent behavior
        run: |
          npm run check:js
          node tests/test_nickname_policy.cjs
          node tests/test_themes.cjs
          node tests/test_bank_boundary.cjs
          node scripts/export-learning-catalog.cjs
          node scripts/check-prerender.cjs
      - name: Both static release targets
        run: |
          node scripts/build-pages.cjs work/ci-cloudflare
          python -m scripts.check_pages work/ci-cloudflare
          node scripts/build-pages.cjs work/ci-github github
          python -m scripts.check_pages work/ci-github github
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install workers-runtime-sdk==1.9.6
      - name: Storage adapter rollback and replay invariants
        run: python -m unittest discover -s cloudflare -p 'test_*.py' -v
      - name: Actual Python Workers and Durable Object runtime
        run: |
          python cloudflare/build_worker.py --vendor-sdk
          python cloudflare/test_runtime.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate and start production image with isolated volume
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
      - name: Full suite inside the built image
        run: docker compose run --rm --no-deps -T --volume "$PWD/tests:/app/tests:ro" --tmpfs /app/work:uid=65532,gid=65532 web python -m unittest discover -s tests -v
      - name: Real browser flows
        env:
          BASE_URL: http://127.0.0.1:8765
          BROWSER_CHANNEL: chromium
        run: npm run test:browser
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down --volumes
